apiVersion: v1
kind: Service
metadata:
  name: users-mongo-service
spec:
  type: ClusterIP
  selector:
    app: users-mongo-app
  ports:
    - port: 27017

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-mongo-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-mongo-statefulset
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: users-mongo-app
  serviceName: users-mongo-service
  template:
    metadata:
      labels:
        app: users-mongo-app
    spec:
      containers:
        - name: users-mongo-container
          image: mongo:6.0.3
          envFrom:
            - secretRef:
                name: users-mongo-secrets
          ports:
            - containerPort: 27017
          
          volumeMounts:
            - name: pvc
              mountPath: /data/db
              subPath: users-mongo-app
      volumes:
        - name: pvc
          persistentVolumeClaim:
            claimName: users-mongo-pvc

--- 

apiVersion: v1
kind: Secret
metadata:
  name: users-mongo-secrets
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: dXNlcg==
  MONGO_INITDB_ROOT_PASSWORD: cGFzcw==
