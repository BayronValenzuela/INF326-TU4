apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-users-app
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-users-container
          image: ttl.sh/frontend-users-img:8h
          ports:
            - containerPort: 3000
