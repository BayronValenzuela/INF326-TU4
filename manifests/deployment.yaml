apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      containers:
      - name: fastapi-container
        image: ttl.sh/ncerpa-inf326-demo-app:8h
        ports:
        - containerPort: 8000
        envFrom:
          - secretRef:
            name: users-secrets

---

apiVersion: v1
kind: Secret
metadata:
  name: users-secrets
type: Opaque
data:
  MONGO_USER: dXNlcg==
  MONGO_PASSWORD: cGFzcw==
  MONGO_HOST: bW9uZ28=